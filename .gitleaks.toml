title = "LankaPay Secret & PII Scanning Configuration"

[extend]
useDefault = true

[[rules]]
id = "pci-pan-luhn-rule"
description = "Potential Luhn-valid Primary Account Number (PAN) / Payment Card (13-19 digits)"
regex = '''\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|6(?:011|5[0-9]{2})[0-9]{12}|3[47][0-9]{13}|99[0-9]{11,17}|[1-9][0-9]{12,18})\b'''

[rules.allowlist]
paths = [
    '''docs/test-cards\.md''',
    '''\.gitleaks\.toml''',
    '''scripts/scan-luhn-cards\.py'''
]
