##############################################################
# Lanka Pay – local development Docker Compose
# Starts MySQL 8 only.
# The Spring Boot app is run separately via ./mvnw spring-boot:run
#
# Usage:
#   docker compose up -d          # start MySQL in background
#   docker compose down           # stop and remove containers
#   docker compose down -v        # also remove the data volume
##############################################################

services:
  mysql:
    image: mysql:8.0
    container_name: lankapay_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lankapay_db
      MYSQL_USER: lankapay_user
      MYSQL_PASSWORD: changeme
    ports:
      - "3307:3306"   # 3306 is used by local MySQL Server; Docker MySQL listens on 3307
    volumes:
      - lankapay_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "lankapay_user", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lankapay_mysql_data:
    driver: local
