##############################################################
# Lanka Pay – main application configuration
# All sensitive values are read from environment variables.
# See .env.example at the project root.
##############################################################

spring:
  application:
    name: lankapay-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lankapay_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:lankapay_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false               # never log SQL in production (may expose data)
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never        # never leak internal error messages
    include-stacktrace: never

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Lanka Pay Backend
    description: "University prototype – all banks and payments are SIMULATED"
    version: 0.0.1-SNAPSHOT

# ── JWT ───────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-replace-in-production-must-be-at-least-32-chars}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:30}

  refresh-token:
    expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS:7}

  otp:
    mode: ${OTP_MODE:TEST}            # TEST = log to console; PROD = real SMS
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    daily-cap: ${OTP_DAILY_CAP:10}

  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

  bank-adapter:
    mode: ${BANK_ADAPTER_MODE:SIMULATED}
    # SIMULATED  → SimulatedBankAdapterA/B/C are active (default, safe for all non-prod envs)
    # REAL_BANK_X → FutureAuthorizedBankAdapter or a real implementation (requires explicit opt-in)

  base-url: ${APP_BASE_URL:http://localhost:8080}

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.lankapay: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: OFF           # keep SQL out of logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
